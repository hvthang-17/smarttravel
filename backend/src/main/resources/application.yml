spring:
  application:
    name: smarttravel-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smarttravel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:12345678}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  weather:
    endpoint: ${APP_WEATHER_ENDPOINT:https://api.open-meteo.com/v1/forecast}
  share:
    base-url: ${APP_SHARE_BASE_URL:}
  routing:
    car-url: ${APP_ROUTING_CAR_URL:}
    foot-url: ${APP_ROUTING_FOOT_URL:}
    motorbike-url: ${APP_ROUTING_MOTORBIKE_URL:}
    token: ${APP_ROUTING_TOKEN:}
    requests-per-minute: ${APP_ROUTING_REQUESTS_PER_MINUTE:30}
  reset:
    email-endpoint: ${APP_RESET_EMAIL_ENDPOINT:https://api.resend.com/emails}
    email-api-key: ${APP_RESET_EMAIL_API_KEY:}
    email-from: ${APP_RESET_EMAIL_FROM:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

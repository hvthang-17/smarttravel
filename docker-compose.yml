services:
  mysql:
    image: mysql:8.4
    container_name: smarttravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smarttravel}
      MYSQL_USER: ${MYSQL_USER:-smarttravel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smarttravel}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - smarttravel_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  smarttravel_mysql:

